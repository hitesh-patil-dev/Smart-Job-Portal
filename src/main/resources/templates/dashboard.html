<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">
💼 Smart Job Portal
</a>
<div>

<a href="/" class="btn btn-outline-light me-2">Home</a>

<a href="/jobs" class="btn btn-outline-light me-2">Jobs</a>

<a href="/addJob" class="btn btn-outline-light me-2">Add Job</a>

<a href="/applications" class="btn btn-outline-light me-2">Applications</a>

<a href="/logout" class="btn btn-danger">Logout</a>

</div>

</div>

</nav>

<div class="container mt-5">

<h2 class="text-center text-primary mb-5">
  📊 Dashboard
</h2>

<div class="row">

<div class="col-md-6">

<div class="card shadow text-center">

   <div class="card-body">

    <h4>Total Jobs</h4>

    <h1 class="text-primary"
        th:text="${totalJobs}">
    </h1>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card shadow text-center">

<div class="card-body">

<h4>Total Users</h4>

<h1 class="text-success"
      th:text="${totalUsers}">
</h1>

</div>

</div>

</div>

</div>

<div class="text-center mt-5">

<h3 class="text-success">
     Welcome to Smart Job Portal 🚀
</h3>

<p class="text-secondary">
    Manage Jobs, Applications and Users Easily.
</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
