<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Job</title>
</head>

<body>

<h2>Edit Job</h2>

<form action="/updateJob" method="post">

<input type="hidden" name="id" th:value="${job.id}">

Job Title:
<input type="text" name="jobTitle" th:value="${job.jobTitle}">
<br><br>

Company Name:
<input type="text" name="companyName" th:value="${job.companyName}">
<br><br>  

Location:
<input type="text" name="location" th:value="${job.location}">
<br><br>

Salary:
<input type="text" name="salary" th:value="${job.salary}">
<br><br>

<button type="submit">Update Job</button>

</form>

</body>
</html>
