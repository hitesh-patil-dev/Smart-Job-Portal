<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Add Job</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">
    💼 Smart Job Portal
</a>

<div>

            <a href="/" class="btn btn-outline-light me-2">Home</a>

            <a href="/jobs" class="btn btn-outline-light me-2">Jobs</a>

            <a href="/addJob" class="btn btn-outline-light me-2">Add Job</a>

            <a href="/applications" class="btn btn-outline-light me-2">Applications</a>

            <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>

            <a href="/logout" class="btn btn-danger">Logout</a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center">

                    <h3>➕ Add New Job</h3>

                </div>

                <div class="card-body">

                    <form action="/saveJob" method="post">

                        <div class="mb-3">

                            <label class="form-label">Job Title</label>

                            <input type="text"
                                   name="jobTitle"
                                   class="form-control"
                                   placeholder="Enter Job Title"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Company Name</label>

                            <input type="text"
                                   name="companyName"
                                   class="form-control"
                                   placeholder="Enter Company Name"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Location</label>

                            <input type="text"
                                   name="location"
                                   class="form-control"
                                   placeholder="Enter Location"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Salary</label>

                            <input type="text"
                                   name="salary"
                                   class="form-control"
                                   placeholder="Enter Salary"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-success">

                                💾 Save Job

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
