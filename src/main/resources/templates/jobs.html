<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>All Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>




<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            💼 Smart Job Portal
        </a>

        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/jobs" class="btn btn-outline-light me-2">
                Jobs
            </a>

            <a href="/addJob" class="btn btn-outline-light me-2">
                Add Job
            </a>

            <a href="/applications" class="btn btn-outline-light me-2">
                Applications
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="text-center text-primary mb-4">
        Available Jobs
    </h2>

    <!-- Search Form -->

    <form action="/searchJobs" method="get" class="d-flex mb-4">

        <input type="text"
               name="keyword"
               class="form-control me-2"
               placeholder="Search Job Title">

        <button class="btn btn-primary">
            🔍 Search
        </button>

    </form>

    <!-- Job Table -->

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Job Title</th>
            <th>Company Name</th>
            <th>Location</th>
            <th>Salary</th>
            <th>Edit</th>
            <th>Delete</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="job : ${jobs}">

            <td th:text="${job.id}"></td>

            <td th:text="${job.jobTitle}"></td>

            <td th:text="${job.companyName}"></td>

            <td th:text="${job.location}"></td>

            <td th:text="${job.salary}"></td>

            <td>

                <a th:href="@{/editJob/{id}(id=${job.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

            </td>

            <td>

                <a th:href="@{/deleteJob/{id}(id=${job.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
