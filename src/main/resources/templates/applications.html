<!DOCTYPE html>
<html xmlns:th="http:www.thymeleaf.org">

<head>
    <title>Job Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">
   
   <a class="navbar-brand" href="/">
      Smart Job Portal
   </a>
   
<div>

   <a href="/" class="btn btn-outline-light me-2">
      Home
   </a>
   
   <a href="/jobs" class="btn btn-outline-light me-2">Jobs</a>
   
   <a href="/addJob" class="btn btn-outline-light me-2">Add Job
   </a>
   
   <a href="/applications" class="btn btn-outline-light">
      Application
   </a>
   
   <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
   
   <a href="/logout" class="btn btn-danger">Logout</a>
   
  </div>
  
 </div>
   
</nav>

<div class="container mt-5"></div>

<h2 class="text-center text-primary mb-4">  📄 All Job Application</h2>

<div class="card shadow">

<div class="card-body">

<table class="table table-bordered table-hover table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>User Name</th>
<th>Email</th>
<th>Job Title</th>

</tr>
</thead>
<tbody>

<tr th:each="app : ${applications}">
<td th:text="${app.id}"></td>
<td th:text="${app.userName}"></td>
<td th:text="${app.email}"></td>
<td th:text="${app.jobTitle}"></td>

</tr>
</tbody>
</table>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
